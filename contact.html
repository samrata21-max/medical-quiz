<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepUpNeuro - Contact Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}main{max-width:700px;margin:auto;padding:56px 24px 80px}.intro{text-align:center}.intro h1{font:600 34px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 30px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:30px;text-align:center}.panel h2{font:600 22px var(--serif);margin:0 0 14px}.panel p{color:var(--soft);line-height:1.7;margin:0 0 14px}.primaryButton{display:inline-block;margin-top:10px;padding:12px 26px;border-radius:6px;background:var(--accent);color:var(--on-accent);font:600 14px var(--sans);text-decoration:none}.primaryButton:hover{background:var(--accent-dark)}.backLink{display:block;text-align:center;margin-top:26px;color:var(--soft);font-size:13px;text-decoration:none}.backLink:hover{color:var(--accent)}</style>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <div class="site-brand"><img class="site-brand__logo" src="stepupneuro_logo.svg" alt="StepUpNeuro"></div>
    <div class="site-header__actions profile">
      <strong id="profileName" class="site-header__profile-name"></strong>
    </div>
  </div>
</header>
<main>
<section class="intro"><h1>Contact Us</h1><p>Questions, feedback or found a problem? We'd love to hear from you.</p></section>
<section class="panel">
<h2>Get in touch</h2>
<p>Send us an email and we'll get back to you as soon as we can.</p>
<a class="primaryButton" href="mailto:contact@stepupneuro.com">Email Us</a>
</section>
<a class="backLink" href="dashboard.html">← Back to Dashboard</a>
</main>
<script src="auth.js"></script>
<script>
const account = requireLogin();
if (account) document.getElementById("profileName").textContent = account.fullName;
</script>
</body>
</html>
