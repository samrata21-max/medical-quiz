<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepUpNeuro - Textbook Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}main{max-width:760px;margin:auto;padding:56px 24px 80px}.intro{text-align:center}.intro h1{font:600 32px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 26px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:22px;margin-bottom:20px}.field{margin-bottom:22px}.fieldTitle,label{display:block;font:12px var(--mono);color:var(--soft);margin-bottom:10px}.select{width:100%;height:42px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--ink);font:14px var(--sans);padding:0 10px}.chapterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chapter{display:flex;gap:9px;align-items:center;border:1px solid var(--border);border-radius:4px;padding:11px 12px;font-size:13px;cursor:pointer}.chapter:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.chapter input{accent-color:var(--accent)}.summary{display:flex;gap:10px}.summary div{flex:1;background:var(--bg);border:1px solid var(--border);padding:11px 12px;border-radius:5px}.summary span{display:block;color:var(--soft);font:10px var(--mono);text-transform:uppercase}.summary strong{display:block;margin-top:4px;font-size:14px}.start{width:100%;height:44px;margin-top:18px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:white;font:600 14px var(--sans);cursor:pointer}.start:hover{background:var(--accent-dark)}.error{text-align:center;color:var(--bad);min-height:18px;font-size:12px;margin-top:9px}.reviewView{display:none}.fact{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:17px 19px;margin-bottom:11px}.factMeta{font:12px var(--mono);color:var(--accent);margin-bottom:7px}.factText{font:16px var(--serif);line-height:1.55}.factPoints{margin:0;padding-left:22px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}@media(max-width:580px){.chapterGrid,.summary{grid-template-columns:1fr;display:grid}.brand{font-size:24px}.profile{flex-wrap:wrap;justify-content:flex-end}}.reviewView,.quizView{display:none}.quizTopRow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.quizProgress{font:12px var(--mono);color:var(--soft)}.quizScoreLine{font:12px var(--mono);color:var(--accent);margin-bottom:18px}.quizQuestionMeta{font:12px var(--mono);color:var(--soft);margin-bottom:8px}.quizQuestionText{font:600 19px var(--serif);line-height:1.5;margin:0 0 18px}.quizOptions{display:grid;gap:9px}.quizOption{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:6px;padding:12px 14px;background:var(--panel);color:var(--ink);font:14px var(--sans);text-align:left;cursor:pointer}.quizOption:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}.quizOption:disabled{cursor:default}.quizOption.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}.quizOption.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}.quizOptionTag{font:600 13px var(--mono);flex-shrink:0}.quizActions{display:flex;justify-content:flex-end;margin-top:18px}
</style></head>
<body><header class="site-header"><div class="site-header__inner"><div class="site-brand"><img class="site-brand__logo" src="stepupneuro_logo.svg" alt="StepUpNeuro"></div><div class="site-header__actions profile"><strong id="profileName" class="site-header__profile-name"></strong></div></div></header><main><section class="intro" id="intro"><h1>Neurology Textbook Revision</h1><p>Select a book and the chapters you want to revise.</p></section><section class="panel" id="selectionPanel"><div class="field"><label for="bookSelect">SELECT BOOK</label><select class="select" id="bookSelect"><option>Neurology Core Review</option><option>Clinical Neurology Essentials</option><option>Neurology SCE Revision</option></select></div><div class="field"><div class="fieldTitle">SELECT CHAPTERS</div><div class="chapterGrid" id="chapterGrid"></div></div><div class="summary"><div><span>Book</span><strong id="summaryBook">Neurology Core Review</strong></div><div><span>Chapters</span><strong id="summaryChapters">0</strong></div></div><div class="error" id="errorMessage"></div><button class="start" id="startButton" type="button">Start Revision</button></section><section class="reviewView" id="reviewView"><div class="panel"><h2 id="reviewHeading" style="font:600 24px var(--serif);margin:0 0 16px"></h2><div id="factList"></div><div class="footer"><button class="secondary" id="changeButton" type="button">Change selection</button></div></div></section><section class="quizView" id="quizView"><div class="panel"><div class="quizTopRow"><h2 id="quizHeading" style="font:600 22px var(--serif);margin:0"></h2><span class="quizProgress" id="quizProgress"></span></div><div class="quizScoreLine" id="quizScoreLine"></div><div id="quizBody"><div class="quizQuestionMeta" id="quizQuestionMeta"></div><h3 class="quizQuestionText" id="quizQuestionText"></h3><div class="quizOptions" id="quizOptions"></div><div class="quizActions"><button class="start" id="quizNextButton" type="button" style="display:none">Next question</button></div></div><div id="quizCompleteBody" style="display:none"><h3 style="font:600 22px var(--serif)">Chapter complete</h3><p id="quizCompleteText" style="color:var(--soft)"></p></div><div class="footer"><button class="secondary" id="quizChangeButton" type="button">Change selection</button><button class="secondary" id="quizDashboardButton" type="button">Dashboard</button></div></div></section></main>
<script src="auth.js"></script><script src="facts.js"></script><script>
const account=requireLogin();if(account)document.getElementById('profileName').textContent=account.fullName;
const chapters=[...new Set(facts.map(f=>f.category))].sort(),chapterGrid=document.getElementById('chapterGrid'),bookSelect=document.getElementById('bookSelect'),summaryChapters=document.getElementById('summaryChapters'),summaryBook=document.getElementById('summaryBook'),errorMessage=document.getElementById('errorMessage');function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}chapterGrid.innerHTML=chapters.map((chapter,i)=>'<label class="chapter"><input type="checkbox" value="'+escapeHtml(chapter)+'">'+escapeHtml(chapter)+'</label>').join('');function update(){summaryBook.textContent=bookSelect.value;const chosen=[...chapterGrid.querySelectorAll('input:checked')].map(input=>input.value);summaryChapters.textContent=chosen.length?chosen.join(', '):'0'}bookSelect.addEventListener('change',update);chapterGrid.addEventListener('change',update);document.getElementById('startButton').addEventListener('click',()=>{const chosen=[...chapterGrid.querySelectorAll('input:checked')].map(input=>input.value);if(!chosen.length){errorMessage.textContent='Select at least one chapter to begin.';return}document.getElementById('selectionPanel').style.display='none';document.getElementById('intro').style.display='none';document.getElementById('reviewView').style.display='block';document.getElementById('reviewHeading').textContent=bookSelect.value+' - revision';const selected=facts.filter(f=>chosen.includes(f.category));document.getElementById('factList').innerHTML=selected.map((f,i)=>'<article class="fact"><div class="factMeta">'+escapeHtml(f.category)+' · '+escapeHtml(f.difficulty)+' · '+(i+1)+'</div>'+(Array.isArray(f.points)?'<ul class="factPoints">'+f.points.map(p=>'<li>'+escapeHtml(p)+'</li>').join('')+'</ul>':'<div class="factText">'+escapeHtml(f.fact)+'</div>')+'</article>').join('');document.body.classList.add('reviewing-textbook');if(typeof updateActiveNavigation==='function')updateActiveNavigation();});document.getElementById('changeButton').addEventListener('click',()=>{document.getElementById('reviewView').style.display='none';document.getElementById('quizView').style.display='none';document.getElementById('selectionPanel').style.display='block';document.getElementById('intro').style.display='block';document.body.classList.remove('reviewing-textbook');if(typeof updateActiveNavigation==='function')updateActiveNavigation();});update();
const bookOptions=["DeJong’s The Neurologic Examination","Bradley and Daroff’s Neurology in Clinical Practice","Shapiro’s Practical Neurology","Continuum: Lifelong Learning in Neurology"];bookSelect.innerHTML=bookOptions.map(book=>'<option>'+escapeHtml(book)+'</option>').join('');summaryBook.textContent=bookSelect.value;bookSelect.dispatchEvent(new Event('change'));
</script><script src="bradley-chapters.js"></script><script src="dejong-chapters.js"></script><script src="textbook-chapters.js"></script><script src="bradley-mcqs.js"></script><script src="dejong-mcqs.js"></script><script src="textbook-quiz.js"></script></body></html>
