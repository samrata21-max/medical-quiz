<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurology MCQ - Textbook Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}header{max-width:1100px;margin:auto;padding:28px 24px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:600 28px var(--serif)}.profile{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px}.navButton,.logout,.secondary{border:1px solid var(--border);background:none;color:var(--soft);padding:7px 13px;border-radius:4px;cursor:pointer}.navButton:hover,.logout:hover,.secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}main{max-width:760px;margin:auto;padding:56px 24px 80px}.intro{text-align:center}.intro h1{font:600 32px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 26px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:22px;margin-bottom:20px}.field{margin-bottom:22px}.fieldTitle,label{display:block;font:12px var(--mono);color:var(--soft);margin-bottom:10px}.select{width:100%;height:42px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--ink);font:14px var(--sans);padding:0 10px}.chapterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chapter{display:flex;gap:9px;align-items:center;border:1px solid var(--border);border-radius:4px;padding:11px 12px;font-size:13px;cursor:pointer}.chapter:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.chapter input{accent-color:var(--accent)}.summary{display:flex;gap:10px}.summary div{flex:1;background:var(--bg);border:1px solid var(--border);padding:11px 12px;border-radius:5px}.summary span{display:block;color:var(--soft);font:10px var(--mono);text-transform:uppercase}.summary strong{display:block;margin-top:4px;font-size:14px}.start{width:100%;height:44px;margin-top:18px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:white;font:600 14px var(--sans);cursor:pointer}.start:hover{background:var(--accent-dark)}.error{text-align:center;color:var(--bad);min-height:18px;font-size:12px;margin-top:9px}.reviewView{display:none}.fact{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:17px 19px;margin-bottom:11px}.factMeta{font:12px var(--mono);color:var(--accent);margin-bottom:7px}.factActions{display:flex;justify-content:flex-end;gap:16px;margin:-2px 0 8px}.factAction{border:none;background:none;color:var(--soft);padding:2px 0;font:500 13px var(--sans);cursor:pointer;border-bottom:1px solid transparent}.factAction:hover{color:var(--accent);border-bottom-color:var(--accent)}.factAction.bookmark.bookmarked{color:#E0A800;font-weight:600}.factAction.flagged{color:var(--flag);font-weight:600}
@keyframes iconPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.factAction{display:inline-block}.iconPop{animation:iconPop .3s ease}
@media(prefers-reduced-motion:reduce){.iconPop{animation:none}}.factText{font:16px var(--serif);line-height:1.55}.factPoints{margin:0;padding-left:22px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}@media(max-width:580px){.chapterGrid,.summary{grid-template-columns:1fr;display:grid}.brand{font-size:24px}.profile{flex-wrap:wrap;justify-content:flex-end}}
</style></head>
<body><header><div class="head"><div class="brand">Neurology MCQ</div><div class="profile"><button class="navButton" id="dashboardButton" type="button">Dashboard</button><strong id="profileName"></strong><button class="logout" id="logoutButton" type="button">Logout</button></div></div></header><main><section class="intro" id="intro"><h1>Neurology Textbook Revision</h1><p>Select a book and the chapters you want to revise.</p></section><section class="panel" id="selectionPanel"><div class="field"><label for="bookSelect">SELECT BOOK</label><select class="select" id="bookSelect"><option>Neurology Core Review</option><option>Clinical Neurology Essentials</option><option>Neurology SCE Revision</option></select></div><div class="field"><div class="fieldTitle">SELECT CHAPTERS</div><div class="chapterGrid" id="chapterGrid"></div></div><div class="summary"><div><span>Book</span><strong id="summaryBook">Neurology Core Review</strong></div><div><span>Chapters</span><strong id="summaryChapters">0</strong></div></div><div class="error" id="errorMessage"></div><button class="start" id="startButton" type="button">Start Revision</button></section><section class="reviewView" id="reviewView"><div class="panel"><h2 id="reviewHeading" style="font:600 24px var(--serif);margin:0 0 16px"></h2><div id="factList"></div><div class="footer"><button class="secondary" id="changeButton" type="button">Change selection</button><button class="secondary" id="dashboardAfter" type="button">Dashboard</button></div></div></section></main>
<script src="auth.js"></script><script src="facts.js"></script><script>
const account=requireLogin();if(account)document.getElementById('profileName').textContent=account.fullName;document.getElementById('logoutButton').addEventListener('click',logout);document.getElementById('dashboardButton').addEventListener('click',()=>location.href='dashboard.html');document.getElementById('dashboardAfter').addEventListener('click',()=>location.href='dashboard.html');
const chapters=[...new Set(facts.map(f=>f.category))].sort(),chapterGrid=document.getElementById('chapterGrid'),bookSelect=document.getElementById('bookSelect'),summaryChapters=document.getElementById('summaryChapters'),summaryBook=document.getElementById('summaryBook'),errorMessage=document.getElementById('errorMessage');function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}chapterGrid.innerHTML=chapters.map((chapter,i)=>'<label class="chapter"><input type="checkbox" value="'+escapeHtml(chapter)+'">'+escapeHtml(chapter)+'</label>').join('');function update(){summaryBook.textContent=bookSelect.value;summaryChapters.textContent=chapterGrid.querySelectorAll('input:checked').length}bookSelect.addEventListener('change',update);chapterGrid.addEventListener('change',update);document.getElementById('startButton').addEventListener('click',()=>{const chosen=[...chapterGrid.querySelectorAll('input:checked')].map(input=>input.value);if(!chosen.length){errorMessage.textContent='Select at least one chapter to begin.';return}document.getElementById('selectionPanel').style.display='none';document.getElementById('intro').style.display='none';document.getElementById('reviewView').style.display='block';document.getElementById('reviewHeading').textContent=bookSelect.value+' - revision';const selected=facts.filter(f=>chosen.includes(f.category));document.getElementById('factList').innerHTML=selected.map((f,i)=>'<article class="fact" data-fact-id="'+escapeHtml(f.id)+'"><div class="factMeta">'+escapeHtml(f.category)+' · '+escapeHtml(f.difficulty)+' · '+(i+1)+'</div><div class="factActions"><button class="factAction bookmark" type="button" data-bookmark-fact="'+escapeHtml(f.id)+'">★&nbsp; Bookmark</button><button class="factAction" type="button" data-flag-fact="'+escapeHtml(f.id)+'">⚑&nbsp; Flag</button></div>'+(Array.isArray(f.points)?'<ul class="factPoints">'+f.points.map(p=>'<li>'+escapeHtml(p)+'</li>').join('')+'</ul>':'<div class="factText">'+escapeHtml(f.fact)+'</div>')+'</article>').join('')});document.getElementById('factList').addEventListener('click',function(event){
 const bookmark=event.target.closest('[data-bookmark-fact]');
 const flag=event.target.closest('[data-flag-fact]');
 if(bookmark){const marked=toggleBookmark(bookmark.dataset.bookmarkFact);bookmark.textContent=marked?'★  Bookmarked':'★  Bookmark';bookmark.classList.toggle('bookmarked',marked);bookmark.classList.remove('iconPop');void bookmark.offsetWidth;bookmark.classList.add('iconPop');}
 if(flag){const flagged=flag.textContent.includes('Flagged');flag.textContent=flagged?'⚑  Flag':'⚑  Flagged';flag.classList.toggle('flagged',!flagged);flag.classList.remove('iconPop');void flag.offsetWidth;flag.classList.add('iconPop');}
});
document.getElementById('changeButton').addEventListener('click',()=>{document.getElementById('reviewView').style.display='none';document.getElementById('selectionPanel').style.display='block';document.getElementById('intro').style.display='block';document.body.classList.remove('reviewing-textbook');if(typeof updateActiveNavigation==='function')updateActiveNavigation()});update();
const bookOptions=["DeJong’s The Neurologic Examination","Bradley and Daroff’s Neurology in Clinical Practice","Shapiro’s Practical Neurology","Continuum: Lifelong Learning in Neurology"];bookSelect.innerHTML=bookOptions.map(book=>'<option>'+escapeHtml(book)+'</option>').join('');summaryBook.textContent=bookSelect.value;bookSelect.dispatchEvent(new Event('change'));
</script><script src="bradley-chapters.js"></script><script src="dejong-chapters.js"></script><script src="textbook-chapters.js"></script><script>
document.getElementById('startButton').addEventListener('click', function() {
  if (document.querySelector('#chapterGrid input:checked')) {
    document.body.classList.add('reviewing-textbook');
    if (typeof updateActiveNavigation === 'function') updateActiveNavigation();
  }
});
</script></body></html>
<style>
@media (max-width:700px) {
  body.android-mobile .factAction { width:34px; min-width:34px; padding:0; text-align:center; font-size:18px; }
}
</style>
<script>
(function(){
  function mobile(){return document.body.classList.contains("android-mobile") || (/Android/i.test(navigator.userAgent) && window.matchMedia("(max-width:700px)").matches);}
  function labels(){
    if(!mobile()) return;
    document.querySelectorAll("[data-bookmark-fact]").forEach(b=>b.textContent="★");
    document.querySelectorAll("[data-flag-fact]").forEach(b=>b.textContent="⚑");
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",labels); else labels();
  window.addEventListener("resize",labels);
})();
</script>
