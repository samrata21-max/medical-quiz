<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurology MCQ - Review Mistakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F0;--panel:#FFF;--ink:#202B2F;--soft:#5B6B70;--border:#DFDBCF;--accent:#1F6F64;--accent-soft:#DCEAE7;--serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}header{max-width:1100px;margin:auto;padding:28px 24px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:600 28px var(--serif)}.profile{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px}.navButton,.logout{border:1px solid var(--border);background:none;color:var(--soft);padding:7px 13px;border-radius:4px;cursor:pointer}.navButton:hover,.logout:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}main{max-width:680px;margin:auto;padding:56px 24px 70px}.intro{text-align:center}.intro h1{font:600 32px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 26px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:22px}.field{margin-bottom:22px}.field:last-of-type{margin-bottom:0}label,.fieldTitle{display:block;font:12px var(--mono);color:var(--soft);margin-bottom:10px}.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{min-height:44px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--ink);font:500 14px var(--sans);cursor:pointer;padding:8px 10px;text-align:left}.choice:hover{border-color:var(--accent);background:var(--accent-soft)}.choice.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.select{width:100%;height:42px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--ink);font:14px var(--sans);padding:0 10px}.summary{display:flex;gap:10px;margin:4px 0 16px}.summaryItem{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:11px 12px}.summaryItem span{display:block;color:var(--soft);font:10px var(--mono);text-transform:uppercase}.summaryItem strong{display:block;margin-top:4px;font-size:14px}.start{width:100%;height:44px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;font:600 14px var(--sans);cursor:pointer}.start:hover{background:#185A51}.start:disabled{opacity:.45;cursor:not-allowed}.error{min-height:18px;color:#B14A3A;text-align:center;font-size:12px;margin:8px 0}.note{text-align:center;color:var(--soft);font-size:12px;margin:10px 0 0}.countNote{color:var(--soft);font-size:12px;margin-top:8px}@media(max-width:520px){.head{align-items:flex-start}.brand{font-size:24px}.profile{flex-wrap:wrap;justify-content:flex-end}.choiceGrid{grid-template-columns:1fr}main{padding-top:40px}.summary{flex-direction:column}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">Neurology MCQ</div><div class="profile"><strong id="profileName"></strong><button class="logout" id="logoutButton" type="button">Logout</button></div></div></header>
<main>
<section class="intro"><h1>Review Mistakes</h1><p>Practice difficult questions until you answer each one correctly three times.</p></section>
<section class="panel">
<div class="field"><div class="fieldTitle">SELECT QUESTIONS</div><div class="choiceGrid" id="filterGrid"><button class="choice selected" type="button" data-filter="all">All mistakes</button><button class="choice" type="button" data-filter="topic">Mistakes by topic</button><button class="choice" type="button" data-filter="repeated">Incorrect more than once</button><button class="choice" type="button" data-filter="recent">Most recent mistakes</button></div></div>
<div class="field" id="topicField" hidden><label for="topicSelect">SELECT TOPIC</label><select class="select" id="topicSelect"></select></div>
<div class="field"><label for="countSelect">NUMBER OF QUESTIONS</label><select class="select" id="countSelect"></select><div class="countNote" id="availableText"></div></div>
<div class="summary"><div class="summaryItem"><span>Filter</span><strong id="summaryFilter">All mistakes</strong></div><div class="summaryItem"><span>Available</span><strong id="summaryAvailable">0</strong></div><div class="summaryItem"><span>Mastery</span><strong>3 correct answers</strong></div></div>
<div class="error" id="errorMessage"></div><button class="start" id="startButton" type="button">Start Review</button><p class="note">There is no timer in Review Mistakes mode.</p>
</section>
</main>
<script src="auth.js"></script><script src="questions.js"></script>
<script>
const account=requireLogin();
if(account)document.getElementById('profileName').textContent=account.fullName;
const statsKey='neurologyMCQQuestionStats_'+account.userId;
let stats={};try{const parsed=JSON.parse(localStorage.getItem(statsKey)||'{}');stats=parsed&&typeof parsed==='object'?parsed:{}}catch(e){}
const filterGrid=document.getElementById('filterGrid'),topicField=document.getElementById('topicField'),topicSelect=document.getElementById('topicSelect'),countSelect=document.getElementById('countSelect'),availableText=document.getElementById('availableText'),summaryFilter=document.getElementById('summaryFilter'),summaryAvailable=document.getElementById('summaryAvailable'),errorMessage=document.getElementById('errorMessage'),startButton=document.getElementById('startButton');
let selectedFilter='all';
function unresolved(q){const entry=stats[q.id];return entry&&(Number(entry.incorrect)||0)>0&&(Number(entry.reviewCorrect)||0)<3}
function mistakeQuestions(){return questions.filter(unresolved)}
function filteredQuestions(){let pool=mistakeQuestions();if(selectedFilter==='topic')pool=pool.filter(q=>(q.category||'General')===topicSelect.value);if(selectedFilter==='repeated')pool=pool.filter(q=>Number(stats[q.id].incorrect)>1);if(selectedFilter==='recent')pool.sort((a,b)=>String(stats[b.id].lastIncorrectAt||'').localeCompare(String(stats[a.id].lastIncorrectAt||'')));return pool}
function renderTopics(){const topics=[...new Set(mistakeQuestions().map(q=>q.category||'General'))].sort();topicSelect.innerHTML=topics.map(t=>'<option value="'+String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+t+'</option>').join('');topicField.hidden=selectedFilter!=='topic'}
function renderCounts(){const available=filteredQuestions().length;countSelect.innerHTML='';[5,10,20,40].filter(n=>n<=available).forEach(n=>{const option=document.createElement('option');option.value=n;option.textContent=n;countSelect.appendChild(option)});if(available) {const option=document.createElement('option');option.value=available;option.textContent='All '+available+' available';countSelect.appendChild(option)}availableText.textContent=available+' question'+(available===1?'':'s')+' available';summaryAvailable.textContent=available;startButton.disabled=!available;errorMessage.textContent=''}
function update(){summaryFilter.textContent=selectedFilter==='all'?'All mistakes':selectedFilter==='topic'?'Mistakes by topic':selectedFilter==='repeated'?'Incorrect more than once':'Most recent mistakes';renderTopics();renderCounts()}
filterGrid.addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;selectedFilter=button.dataset.filter;filterGrid.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===button));update()});topicSelect.addEventListener('change',renderCounts);document.getElementById('dashboardButton').addEventListener('click',()=>location.href='dashboard.html');document.getElementById('logoutButton').addEventListener('click',logout);
startButton.addEventListener('click',()=>{const pool=filteredQuestions();const count=Number(countSelect.value);if(!pool.length){errorMessage.textContent='There are no mistakes matching this filter.';return}localStorage.setItem('neurologyMCQSessionMode','reviewMistakes');localStorage.setItem('neurologyMCQReviewMistakesConfig',JSON.stringify({category:'all',questionCount:Math.min(count,pool.length),difficulty:'all',filter:selectedFilter,topic:selectedFilter==='topic'?topicSelect.value:'',createdAt:new Date().toISOString()}));localStorage.removeItem('neurologyMCQProgress');location.href='index.html'});update();
</script>
</body>
</html>
