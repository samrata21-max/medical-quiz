<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="19.222 29 504 101" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>StepUpNeuro logo</title>
<desc>StepUpNeuro wordmark in blue, purple and red, with a red rounded-square SUN monogram badge</desc>

<!-- Badge -->
<g transform="translate(70,80)">
<rect x="-46" y="-46" width="92" height="92" rx="18" fill="#dc2626"/>
<text x="0" y="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="#ffffff">SUN</text>
</g>

<!-- Wordmark -->
<text x="140" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52">
<tspan fill="#1d4ed8">Step</tspan><tspan fill="#6d28d9">Up</tspan><tspan fill="#5b21b6">Neu</tspan><tspan fill="#dc2626">r</tspan><tspan fill="#5b21b6">o</tspan>
</text>
</svg>
