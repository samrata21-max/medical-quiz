<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurology MCQ — Sign in</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="loginPage">
        <section class="loginCard" aria-label="Neurology MCQ sign in">

            <div class="brand">
                <div class="brandName">Neurology MCQ</div>
                <div class="brandLine"></div>
            </div>

            <h1>Sign in</h1>
            
            <form id="loginForm" novalidate>

                <br>

                <div class="inputWrap">
                    <span class="inputIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"></circle><path d="M5.5 20c.7-4 2.9-6 6.5-6s5.8 2 6.5 6"></path></svg></span>
                    <input
                        type="text"
                        id="userId"
                        name="userId"
                        placeholder="Enter username, email or mobile"
                        autocomplete="username"
                        required
                    >
                </div>


                <label for="password">Password</label>

                <div class="inputWrap">
                    <span class="inputIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 10h8M8 14h6"></path></svg></span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        class="togglePassword"
                        aria-label="Show password"
                    >Show</button>
                </div>


                <p id="loginMessage" class="loginMessage" role="alert"></p>

                <button type="submit" class="signInButton">
                    Sign in
                </button>

            </form>


            <div class="registerPrompt">
                <span>New user?</span>
                <button type="button" id="registerButton">
                    Register
                </button>
            </div>

        </section>

    </main>

    <script src="auth.js"></script>
<script src="login.js"></script>

</body>
</html>
