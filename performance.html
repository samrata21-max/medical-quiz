<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurology MCQ - Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}header{max-width:1100px;margin:auto;padding:28px 24px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:600 28px var(--serif)}.profile{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px}.navButton,.logout{border:1px solid var(--border);background:none;color:var(--soft);padding:7px 13px;border-radius:4px;cursor:pointer}.navButton:hover,.logout:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}main{max-width:1000px;margin:auto;padding:56px 24px 80px}.intro{text-align:center}.intro h1{font:600 34px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 30px}.summaryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px}.metric{padding:18px}.metric strong{display:block;font:600 28px var(--serif)}.metric span{display:block;color:var(--soft);font-size:12px;margin-top:4px}.panel{padding:22px;margin-bottom:18px}.panel h2{font:600 23px var(--serif);margin:0 0 16px}.topicRow{display:grid;grid-template-columns:1.5fr 2fr 70px;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--border)}.topicName{font-size:14px}.bar{height:8px;background:var(--bg);border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);border-radius:5px}.topicScore{font:12px var(--mono);color:var(--accent);text-align:right}.historyRow{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:12px;color:var(--soft)}.historyRow strong{color:var(--ink);display:block;font:600 16px var(--serif)}.empty{color:var(--soft);font-size:13px}@media(max-width:650px){.summaryGrid{grid-template-columns:repeat(2,1fr)}.topicRow{grid-template-columns:1fr 80px}.topicScore{text-align:left}.topicRow .bar{grid-column:1 / -1}.historyRow{grid-template-columns:1fr 1fr}.brand{font-size:24px}.profile{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body><header><div class="head"><div class="brand">Neurology MCQ</div><div class="profile"><strong id="profileName"></strong><button class="logout" id="logoutButton" type="button">Logout</button></div></div></header>
<main><section class="intro"><h1>Performance</h1><p>Your overall progress across tests, questions, topics and mistakes.</p></section><section class="summaryGrid"><div class="metric"><strong id="accuracy">0%</strong><span>Overall accuracy</span></div><div class="metric"><strong id="answered">0</strong><span>Questions answered</span></div><div class="metric"><strong id="tests">0</strong><span>Tests completed</span></div><div class="metric"><strong id="mistakes">0</strong><span>Questions to review</span></div></section><section class="panel"><h2>Topic performance</h2><div id="topicList"></div></section></main>
<script src="auth.js"></script><script src="questions.js"></script>
<script>
const account=requireLogin();if(account)document.getElementById('profileName').textContent=account.fullName;document.getElementById('logoutButton').addEventListener('click',logout);document.getElementById('dashboardButton').addEventListener('click',()=>location.href='dashboard.html');
let stats={},history=[];try{const parsed=JSON.parse(localStorage.getItem('neurologyMCQQuestionStats_'+account.userId)||'{}');stats=parsed&&typeof parsed==='object'?parsed:{}}catch(e){}try{const parsed=JSON.parse(localStorage.getItem('neurologyMCQTestHistory')||'[]');history=Array.isArray(parsed)?parsed.filter(x=>!x.userId||x.userId===account.userId):[]}catch(e){}
const answered=Object.keys(stats).reduce((n,id)=>n+(Number(stats[id].correct)||0)+(Number(stats[id].incorrect)||0),0),correct=Object.keys(stats).reduce((n,id)=>n+(Number(stats[id].correct)||0),0);document.getElementById('accuracy').textContent=answered?Math.round(correct/answered*100)+'%':'0%';document.getElementById('answered').textContent=answered;document.getElementById('tests').textContent=history.length;document.getElementById('mistakes').textContent=questions.filter(q=>stats[q.id]&&Number(stats[q.id].incorrect)>0&&Number(stats[q.id].reviewCorrect||0)<3).length;
const topicMap={};questions.forEach(q=>{const id=q.id,e=stats[id]||{};const item=topicMap[q.category||'General']||(topicMap[q.category||'General']={correct:0,attempts:0});item.correct+=Number(e.correct)||0;item.attempts+=(Number(e.correct)||0)+(Number(e.incorrect)||0)});const topicList=document.getElementById('topicList');topicList.innerHTML=Object.keys(topicMap).sort().map(topic=>{const item=topicMap[topic],pct=item.attempts?Math.round(item.correct/item.attempts*100):0;return '<div class="topicRow"><div class="topicName">'+topic+'</div><div class="bar"><span style="width:'+pct+'%"></span></div><div class="topicScore">'+pct+'%</div></div>'}).join('');
</script></body></html>
