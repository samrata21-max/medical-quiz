<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Neurology MCQ — Test Review</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="siteHeader"><div id="headerRow"><h1>Neurology MCQ</h1><div id="headerStats"><div id="profileArea"><button type="button" id="dashboardButton">Dashboard</button><span id="profileIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"></circle><path d="M5.5 21c.7-4.2 2.9-6.5 6.5-6.5s5.8 2.3 6.5 6.5"></path></svg></span><span id="profileName"></span></div></div></div><svg id="waveform" viewBox="0 0 700 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0,14 L60,14 L75,4 L90,24 L105,14 L160,14 L175,6 L190,22 L205,14 L260,14 L275,2 L290,26 L305,14 L360,14 L375,8 L390,20 L405,14 L460,14 L475,4 L490,24 L505,14 L560,14 L575,6 L590,22 L605,14 L660,14 L675,4 L690,24 L700,14" /></svg></header>
<main id="quizMain"><section id="resultsSummary" style="display:block"><div class="resultsHeading">Test completed</div><div class="scoreCircle" id="scoreCircle"><span id="finalPercentage">0%</span></div><div class="finalScoreLine" id="finalScoreLine">0 / 0</div><div class="resultsStats"><div class="resultStat correct"><strong id="correctCount">0</strong><span>Correct</span></div><div class="resultStat wrong"><strong id="incorrectCount">0</strong><span>Incorrect</span></div><div class="resultStat unanswered"><strong id="unansweredCount">0</strong><span>Unanswered</span></div></div><div class="timeTaken" id="timeTaken">Time taken: 00:00</div></section><div id="reviewContainer" style="display:block"></div></main>
<script src="auth.js"></script><script src="questions.js"></script><script>
const account=requireLogin();if(!account)throw new Error('Login required');document.getElementById('profileName').textContent=account.fullName;document.getElementById('dashboardButton').addEventListener('click',()=>location.href='dashboard.html');
let session=null;try{session=JSON.parse(localStorage.getItem('neurologyMCQHistoryReview')||'null')}catch{}if(!session||session.userId!==account.userId){location.href='test-history.html';throw new Error('No history review selected');}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmtTime(s){s=Math.max(0,Number(s)||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
const map=new Map(questions.map(q=>[q.id,q]));const qs=(session.questionIds||[]).map(id=>map.get(id)).filter(Boolean);const answers=session.userAnswers||[];document.getElementById('finalPercentage').textContent=(session.percentage||0)+'%';document.getElementById('scoreCircle').style.setProperty('--percentage',(session.percentage||0)+'%');document.getElementById('finalScoreLine').textContent=(session.score||0)+' / '+(session.questionCount||qs.length);document.getElementById('correctCount').textContent=session.correct??session.score??0;document.getElementById('incorrectCount').textContent=session.incorrect??0;document.getElementById('unansweredCount').textContent=session.unanswered??0;document.getElementById('timeTaken').textContent='Time taken: '+fmtTime(session.timeTakenSeconds);
const rc=document.getElementById('reviewContainer');rc.innerHTML='<div class="reviewTopRow"><div><h2>Review answers</h2><p>Previous completed test · '+escapeHtml(session.category==='all'?'All topics':session.category)+' · '+escapeHtml(session.difficulty||'All levels')+'</p></div></div><div class="reviewNavigatorPanel" id="reviewNavigatorPanel"><button type="button" class="reviewNavigatorToggle" id="reviewNavigatorToggle" aria-expanded="false"><span>Questions</span><span class="reviewNavigatorCount">'+qs.length+'</span><span class="reviewNavigatorToggleIcon" aria-hidden="true">▾</span></button><div class="reviewNavigatorBody"><div class="reviewNavigator" id="reviewNavigator"></div></div></div><article id="reviewCard" class="reviewCard"></article><div class="reviewPager"><button id="prev">← Previous Question</button><span id="pos"></span><button id="next">Next Question →</button></div>';
document.getElementById('reviewNavigatorToggle').addEventListener('click',function(){const p=document.getElementById('reviewNavigatorPanel');const open=p.classList.toggle('open');this.setAttribute('aria-expanded',open?'true':'false')});
let idx=0;const nav=document.getElementById('reviewNavigator');qs.forEach((q,i)=>{const b=document.createElement('button');b.className='reviewNavButton';b.textContent=i+1;const a=answers[i],st=a==null?'unanswered':a===q.correctAnswer?'correct':'incorrect';b.classList.add(st);b.onclick=()=>{show(i);document.getElementById('reviewNavigatorPanel').classList.remove('open');document.getElementById('reviewNavigatorToggle').setAttribute('aria-expanded','false')};nav.appendChild(b)});function show(i){if(i<0||i>=qs.length)return;idx=i;const q=qs[i],a=answers[i],st=a==null?'unanswered':a===q.correctAnswer?'correct':'incorrect',status=st==='correct'?'✓ Correct':st==='incorrect'?'✕ Incorrect':'— Not answered';const options=['A','B','C','D'].map(l=>'<div class="reviewOption '+(l===q.correctAnswer?'reviewCorrect':(l===a?'reviewWrong':''))+'"><span class="reviewOptionTag">'+l+'</span><span>'+escapeHtml(q['option'+l])+'</span></div>').join('');document.getElementById('reviewCard').innerHTML='<div class="reviewCardHeader"><div><span class="reviewQuestionLabel">Question '+(i+1)+'</span><span class="reviewStatus '+st+'">'+status+'</span></div></div><div class="reviewSubject">'+escapeHtml(q.subject||q.category||'Neurology')+'</div><div class="reviewStem">'+escapeHtml(q.questionText)+'</div><div class="reviewOptions">'+options+'</div><div class="reviewAnswerBlock"><div><span>Your answer</span><strong>'+(a==null?'Not answered':escapeHtml(a+' — '+q['option'+a]))+'</strong></div><div><span>Correct answer</span><strong>'+escapeHtml(q.correctAnswer+' — '+q['option'+q.correctAnswer])+'</strong></div></div><div class="reviewExplanation"><span>Explanation</span><p>'+escapeHtml(q.explanation)+'</p></div>';nav.querySelectorAll('button').forEach((b,n)=>b.classList.toggle('active',n===i));document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===qs.length-1;document.getElementById('pos').textContent=(i+1)+' of '+qs.length}document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(idx-1)}if(e.key==='ArrowRight'){e.preventDefault();show(idx+1)}});show(0);
</script></body></html>
