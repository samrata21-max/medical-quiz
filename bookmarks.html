<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepUpNeuro - Bookmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}main{max-width:900px;margin:auto;padding:56px 24px 80px}.intro{text-align:center}.intro h1{font:600 34px var(--serif);margin:0 0 7px}.intro p{color:var(--soft);margin:0 0 28px}
.bookmarkControls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.tabs{display:flex;gap:8px}.tab,.sortSelect{border:1px solid var(--border);background:var(--panel);color:var(--soft);padding:8px 14px;border-radius:9px;font:13px var(--sans);cursor:pointer}.tab.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}.sortSelect{color:var(--ink)}.list{display:grid;gap:10px}.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--accent)}.card.fact::before{background:var(--violet-fg)}.cardToggle{display:block;width:100%;border:0;background:none;color:inherit;text-align:left;padding:17px 106px 17px 22px;cursor:pointer}.cardToggle:hover{background:var(--bg)}.cardToggle:focus-visible,.remove:focus-visible,.action:focus-visible{outline:3px solid var(--accent-soft);outline-offset:-3px}.cardTop{display:flex;align-items:center;gap:9px;margin-bottom:6px}.typeLabel{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}.fact .typeLabel{color:var(--violet-fg)}.meta{font:12px var(--mono);color:var(--soft)}.prompt{font:600 19px var(--serif);line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.expanded .prompt{-webkit-line-clamp:unset}.chevron{position:absolute;right:62px;top:50%;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);border-radius:8px;color:var(--soft);font-size:18px;transform:translateY(-50%);transition:transform .18s ease}.expanded .chevron{transform:translateY(-50%) rotate(180deg)}.remove{position:absolute;right:17px;top:50%;width:32px;height:32px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--soft);font-size:17px;cursor:pointer;transform:translateY(-50%)}.remove:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}.details{display:none;border-top:1px solid var(--border);padding:0 20px 18px 22px}.expanded .details{display:block}.options{display:grid;gap:5px;margin-top:15px}.option{padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}.answer{display:flex;gap:8px;align-items:flex-start;margin-top:15px;padding:12px 14px;border-left:3px solid var(--good);background:var(--good-bg);font-size:14px}.answerIcon{color:var(--good);font-weight:700;line-height:1.35}.explanation{color:var(--soft);font-size:13px;line-height:1.6;margin-top:10px}.cardActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.action{border:1px solid var(--border);background:none;color:var(--soft);padding:8px 12px;border-radius:8px;cursor:pointer}.action:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.undoNotice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--ink);color:var(--on-accent);border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:5}.undoNotice button{border:0;background:none;color:#AFC5FF;font:600 13px var(--sans);cursor:pointer}.empty{text-align:center;padding:40px 20px;background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--soft)}@media(max-width:700px){header{padding:24px 16px 0}.brand{font-size:24px}main{padding:40px 16px 60px}.prompt{font-size:18px}.bookmarkControls{align-items:stretch;flex-direction:column}.tabs{flex-wrap:wrap}.sortSelect{width:100%}.cardToggle{padding-left:20px}.details{padding-left:20px}}
.prompt{word-break:normal;overflow-wrap:normal;hyphens:none;text-overflow:ellipsis}.remove{border-color:var(--border)}
.cardToggle{padding-right:22px}.cardToggle .chevron{display:none}.cardFooter{display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);padding:10px 20px 10px 22px}.rowIconButton,.cardFooter .remove{position:static;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--soft);font:18px/1 var(--sans);cursor:pointer;transform:none}.rowIconButton:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.cardFooter .remove:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
</style></head>
<body><header class="site-header"><div class="site-header__inner"><div class="site-brand"><img class="site-brand__logo" src="stepupneuro_logo.svg" alt="StepUpNeuro"></div><div class="site-header__actions profile"><span id="profileName" class="site-header__profile-name"></span></div></div></header><main><section class="intro"><h1>Bookmarks</h1><p>Review the questions and learning facts you have saved.</p></section><div class="bookmarkControls"><div class="tabs" aria-label="Bookmark type"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="question">Questions</button><button class="tab" data-filter="fact">Facts</button></div><label><span class="srOnly">Sort bookmarks</span><select id="sortBookmarks" class="sortSelect"><option value="recent">Recently bookmarked</option><option value="type">Questions first</option></select></label></div><div id="bookmarkList" class="list"></div></main>
<script src="auth.js"></script><script src="questions.js"></script><script src="facts.js"></script><script>
const account=requireLogin();if(!account)throw new Error("Login required");document.getElementById("profileName").textContent=account.fullName;const list=document.getElementById("bookmarkList");let filter="all",sort="recent",lastRemoved=null;
function esc(v){return String(v==null?"":v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
function questionCard(x){const q=x.data;return '<article class="card question" data-card><button class="cardToggle" type="button" aria-expanded="false"><span class="cardTop"><span class="typeLabel">Question</span><span class="meta">'+esc(q.subject||q.category||"Neurology")+'</span></span><span class="prompt">'+esc(q.questionText)+'</span><span class="chevron" aria-hidden="true">⌄</span></button><button class="remove" type="button" data-remove="'+esc(x.id)+'" aria-label="Remove bookmark" title="Remove bookmark">🗑</button><div class="details"><div class="options">'+["A","B","C","D"].map(l=>'<div class="option"><strong>'+l+'.</strong> '+esc(q["option"+l])+'</div>').join("")+'</div><div class="answer"><span class="answerIcon" aria-hidden="true">✓</span><span><span class="srOnly">Correct answer: </span><strong>'+esc(q.correctAnswer)+'. '+esc(q["option"+q.correctAnswer])+'</strong></span></div><div class="explanation">'+esc(q.explanation||"")+'</div><div class="cardActions"><button class="action" data-practice-question="'+esc(x.id)+'">Practice again</button></div></div></article>';}
function factCard(x){const f=x.data;return '<article class="card fact" data-card><button class="cardToggle" type="button" aria-expanded="false"><span class="cardTop"><span class="typeLabel">Fact</span><span class="meta">'+esc(f.topic||"Neurology")+' · '+esc(f.difficulty||"")+'</span></span><span class="prompt">'+esc(f.prompt)+'</span><span class="chevron" aria-hidden="true">⌄</span></button><button class="remove" type="button" data-remove="'+esc(x.id)+'" aria-label="Remove bookmark" title="Remove bookmark">🗑</button><div class="details"><div class="answer"><span class="answerIcon" aria-hidden="true">✓</span><span><span class="srOnly">Answer: </span><strong>'+esc(f.answer||"")+'</strong></span></div><div class="explanation">'+esc(f.explanation||"")+'</div><div class="cardActions"><button class="action" data-practice-fact>Practice again</button></div></div></article>';}
function showUndo(){const old=document.querySelector(".undoNotice");if(old)old.remove();const notice=document.createElement("div");notice.className="undoNotice";notice.innerHTML='<span>Bookmark removed.</span><button type="button">Undo</button>';document.body.appendChild(notice);const timer=setTimeout(()=>notice.remove(),5000);notice.querySelector("button").addEventListener("click",()=>{clearTimeout(timer);if(lastRemoved)setBookmarked(lastRemoved,true);notice.remove();render();});}
function render(){const saved=getBookmarks(),items=[];(typeof questions!=="undefined"?questions:[]).forEach(q=>{if(saved[String(q.id)])items.push({type:"question",id:q.id,data:q,savedAt:Number(saved[String(q.id)])||0})});(typeof facts!=="undefined"?facts:[]).forEach(f=>{if(saved[String(f.id)])items.push({type:"fact",id:f.id,data:f,savedAt:Number(saved[String(f.id)])||0})});const visible=items.filter(x=>filter==="all"||x.type===filter).sort((a,b)=>sort==="type"?a.type.localeCompare(b.type):b.savedAt-a.savedAt);if(!visible.length){list.innerHTML='<div class="empty">No bookmarked '+(filter==="all"?"questions or facts":filter+"s")+' yet.</div>';return}list.innerHTML=visible.map(x=>x.type==="question"?questionCard(x):factCard(x)).join("");list.querySelectorAll(".cardToggle").forEach(b=>b.addEventListener("click",()=>{const card=b.closest("[data-card]"),expanded=card.classList.toggle("expanded");b.setAttribute("aria-expanded",expanded)}));list.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>{lastRemoved=b.dataset.remove;setBookmarked(lastRemoved,false);render();showUndo()}));list.querySelectorAll("[data-practice-question]").forEach(b=>b.addEventListener("click",()=>{localStorage.setItem("neurologyMCQSessionMode","questionBank");localStorage.setItem("neurologyMCQQuestionBankConfig",JSON.stringify({category:"all",questionCount:1,difficulty:"all",questionIds:[b.dataset.practiceQuestion],createdAt:new Date().toISOString()}));localStorage.removeItem("neurologyMCQQuestionBankProgress");location.href="index.html"}));list.querySelectorAll("[data-practice-fact]").forEach(b=>b.addEventListener("click",()=>location.href="review-facts.html"));}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");filter=t.dataset.filter;render()}));document.getElementById("sortBookmarks").addEventListener("change",e=>{sort=e.target.value;render()});render();
</script>
<script>
function arrangeBookmarkRowControls(){
  document.querySelectorAll(".card[data-card]:not([data-controls-arranged])").forEach(card=>{
    const toggle=card.querySelector(".cardToggle"),remove=card.querySelector(".remove");
    if(!toggle||!remove)return;
    card.dataset.controlsArranged="true";
    const footer=document.createElement("div");footer.className="cardFooter";
    const expand=document.createElement("button");expand.type="button";expand.className="rowIconButton";expand.setAttribute("aria-label","Expand bookmark");expand.textContent="⌄";
    const sync=()=>{const open=card.classList.contains("expanded");expand.textContent=open?"⌃":"⌄";expand.setAttribute("aria-label",open?"Collapse bookmark":"Expand bookmark");};
    expand.addEventListener("click",()=>{toggle.click();sync()});
    toggle.addEventListener("click",sync);
    footer.append(expand,remove);card.append(footer);sync();
  });
}
arrangeBookmarkRowControls();
new MutationObserver(arrangeBookmarkRowControls).observe(document.getElementById("bookmarkList"),{childList:true});
</script></body></html>
